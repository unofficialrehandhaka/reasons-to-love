<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reasons I love you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="page-header">
      <h1>reasons I love you</h1>
      <p class="hint">pull the thread</p>
    </header>

    <main class="ball-stage">
      <svg id="ballSvg" viewBox="0 0 300 430" aria-label="A ball of yarn with a loose thread you can pull">

        <defs>
          <radialGradient id="ballShade" cx="38%" cy="34%" r="75%">
            <stop offset="0%" stop-color="#C0708A"/>
            <stop offset="55%" stop-color="#A85D72"/>
            <stop offset="100%" stop-color="#8A4B5D"/>
          </radialGradient>
          <clipPath id="ballClip">
            <circle cx="150" cy="150" r="108"/>
          </clipPath>
        </defs>

        <!-- soft shadow the ball sits on -->
        <ellipse cx="150" cy="266" rx="86" ry="14" fill="#8F4A5C" opacity="0.18"/>

        <!-- the yarn ball -->
        <g id="ballGroup">
          <circle cx="150" cy="150" r="108" fill="url(#ballShade)"/>
          <g clip-path="url(#ballClip)">
            <path d="M102.6,244.7 Q78.4,139.6 131.5,45.8" fill="none" stroke="#8F4A5C" stroke-width="4.6" stroke-linecap="round" opacity="0.47"/>
            <path d="M44.3,145.1 Q121.4,79.7 222.2,72.6" fill="none" stroke="#A85D72" stroke-width="3.8" stroke-linecap="round" opacity="0.62"/>
            <path d="M199.1,56.3 Q209.5,158.1 172.2,253.5" fill="none" stroke="#B4677A" stroke-width="3.6" stroke-linecap="round" opacity="0.54"/>
            <path d="M50.8,113.1 Q151.2,84.0 250.5,116.8" fill="none" stroke="#C0708A" stroke-width="5.2" stroke-linecap="round" opacity="0.72"/>
            <path d="M234.4,213.8 Q141.7,158.9 80.0,70.6" fill="none" stroke="#8F4A5C" stroke-width="5.2" stroke-linecap="round" opacity="0.7"/>
            <path d="M44.2,152.4 Q148.1,199.9 255.3,160.5" fill="none" stroke="#B4677A" stroke-width="4.6" stroke-linecap="round" opacity="0.55"/>
            <path d="M195.2,245.7 Q200.8,143.2 168.6,45.8" fill="none" stroke="#B4677A" stroke-width="6.1" stroke-linecap="round" opacity="0.74"/>
            <path d="M125.0,252.8 Q202.8,198.9 250.7,117.3" fill="none" stroke="#A85D72" stroke-width="5.8" stroke-linecap="round" opacity="0.51"/>
            <path d="M44.4,157.3 Q147.8,145.9 213.1,65.0" fill="none" stroke="#C0708A" stroke-width="5.6" stroke-linecap="round" opacity="0.69"/>
            <path d="M57.2,99.1 Q129.3,189.0 244.2,198.2" fill="none" stroke="#B4677A" stroke-width="5.6" stroke-linecap="round" opacity="0.48"/>
            <path d="M137.5,44.9 Q131.3,155.4 195.2,245.7" fill="none" stroke="#C0708A" stroke-width="5.6" stroke-linecap="round" opacity="0.8"/>
          </g>
          <!-- fiber fuzz around the rim -->
          <g id="fibers" stroke="#8F4A5C" stroke-width="1.2" stroke-linecap="round">
            <line x1="88.2" y1="238.6" x2="83.8" y2="244.9" opacity="0.41"/>
            <line x1="67.2" y1="80.7" x2="63.0" y2="77.2" opacity="0.37"/>
            <line x1="124.8" y1="255.0" x2="123.3" y2="261.5" opacity="0.42"/>
            <line x1="243.6" y1="96.1" x2="248.3" y2="93.4" opacity="0.35"/>
            <line x1="62.0" y1="212.6" x2="58.4" y2="215.1" opacity="0.34"/>
            <line x1="52.1" y1="195.7" x2="46.9" y2="198.1" opacity="0.51"/>
            <line x1="257.6" y1="140.8" x2="264.0" y2="140.3" opacity="0.41"/>
            <line x1="163.0" y1="257.2" x2="163.4" y2="260.6" opacity="0.35"/>
            <line x1="91.3" y1="59.4" x2="89.6" y2="56.8" opacity="0.55"/>
            <line x1="194.5" y1="248.4" x2="196.4" y2="252.4" opacity="0.34"/>
            <line x1="44.5" y1="126.7" x2="38.6" y2="125.4" opacity="0.4"/>
            <line x1="226.1" y1="226.6" x2="231.3" y2="231.8" opacity="0.59"/>
            <line x1="224.4" y1="71.7" x2="229.8" y2="66.1" opacity="0.5"/>
            <line x1="49.4" y1="110.7" x2="44.8" y2="108.9" opacity="0.42"/>
            <line x1="42.7" y1="162.5" x2="37.8" y2="163.1" opacity="0.36"/>
            <line x1="62.9" y1="86.1" x2="60.1" y2="84.0" opacity="0.47"/>
            <line x1="247.6" y1="196.2" x2="251.3" y2="197.9" opacity="0.41"/>
            <line x1="78.3" y1="69.3" x2="73.1" y2="63.4" opacity="0.48"/>
            <line x1="216.7" y1="235.0" x2="220.8" y2="240.3" opacity="0.52"/>
            <line x1="180.0" y1="253.8" x2="182.1" y2="261.2" opacity="0.41"/>
          </g>
        </g>

        <!-- the pull thread + tab -->
        <g id="threadGroup">
          <path id="threadPath" d="M219,233 Q235,275 245,320" fill="none" stroke="#B4677A" stroke-width="3.5" stroke-linecap="round"/>
          <circle id="thumbKnotBack" cx="245" cy="320" r="10" fill="#8F4A5C" opacity="0.5"/>
          <circle id="thumbKnot" cx="245" cy="320" r="9" fill="#B4677A"/>
        </g>

      </svg>

      <button id="pullTarget" class="pull-target" aria-label="Pull the thread to reveal a reason"></button>

      <p class="counter" id="counter"></p>
    </main>

    <div class="note-overlay" id="noteOverlay">
      <div class="note-card" id="noteCard">
        <button class="note-close" id="noteClose" aria-label="Close">&times;</button>
        <p class="note-text" id="noteText"></p>
      </div>
    </div>

  </div>

  <script src="reasons.js"></script>
  <script src="script.js"></script>
</body>
</html>
